<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mining Exam Trainer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        .katex-formula {
            font-family: 'Fira Code', monospace;
            background: rgba(59, 130, 246, 0.08);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
        }
        .dark .katex-formula {
            background: rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans min-h-screen flex flex-col transition-colors duration-200">

    <!-- Navbar -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-xl shadow-lg shadow-blue-500/30 flex items-center justify-center">
                    <i class="fa-solid fa-graduation-cap text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Data Mining Exam Trainer</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Master core algorithms with instant practice & grading</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button id="themeToggle" onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Toggle Theme">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Sidebar Navigation -->
        <aside class="lg:col-span-1 space-y-2">
            <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 px-3 mb-2">Modules</div>
            <nav id="moduleNav" class="space-y-1">
                <!-- Populated by JS -->
            </nav>
            <div class="pt-6 px-3">
                <div class="p-4 rounded-2xl bg-gradient-to-br from-blue-500/10 to-indigo-500/10 border border-blue-500/20">
                    <h3 class="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider mb-1">Exam Tips</h3>
                    <p class="text-xs text-slate-600 dark:text-slate-300">Tolerance is set to ±0.01. Always verify your rounding rules and formula parameters before submitting.</p>
                </div>
            </div>
        </aside>

        <!-- Content Panel -->
        <section class="lg:col-span-3 space-y-6">
            <div id="moduleContent" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-sm">
                <!-- Dynamically rendered problem content -->
            </div>
        </section>

    </main>

    <!-- Script Logic -->
    <script>
        // Theme Toggle
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        // State & Modules definition
        let currentModule = 'distance';
        let problemData = {};

        const modules = [
            { id: 'distance', name: 'Distance & Norms', icon: 'fa-ruler', desc: 'Euclidean, Manhattan & Lp Norms' },
            { id: 'scaling', name: 'Scaling & Normalization', icon: 'fa-sliders', desc: 'StandardScaler & MinMaxScaler' },
            { id: 'similarity', name: 'Similarity & Metrics', icon: 'fa-clone', desc: 'Cosine Similarity & Jaccard Coefficient' },
            { id: 'trees', name: 'Decision Trees & Gini Split', icon: 'fa-folder-tree', desc: 'Gini Impurity & Information Gain' },
            { id: 'performance', name: 'Performance Evaluation', icon: 'fa-chart-pie', desc: 'Confusion Matrix, Precision, Recall, F1' },
            { id: 'bayes', name: 'Naive Bayes & Laplace', icon: 'fa-brain', desc: 'Bayes Theorem & Laplace Smoothing' },
            { id: 'stats', name: 'Descriptive Statistics', icon: 'fa-calculator', desc: 'Sample Mean & Standard Deviation' }
        ];

        // Random helpers
        const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const randFloat = (min, max, decimals = 2) => parseFloat((Math.random() * (max - min) + min).toFixed(decimals));

        // Generate Problem Data for active module
        function generateProblem(modId) {
            currentModule = modId;
            switch(modId) {
                case 'distance':
                    problemData = {
                        p: [randInt(-5, 10), randInt(-5, 10), randInt(-5, 10)],
                        q: [randInt(-5, 10), randInt(-5, 10), randInt(-5, 10)],
                        r: randInt(1, 3) // L_r norm
                    };
                    problemData.ansEuclidean = Math.sqrt(problemData.p.reduce((acc, val, i) => acc + Math.pow(val - problemData.q[i], 2), 0));
                    problemData.ansManhattan = problemData.p.reduce((acc, val, i) => acc + Math.abs(val - problemData.q[i]), 0);
                    problemData.ansLp = Math.pow(problemData.p.reduce((acc, val, i) => acc + Math.pow(Math.abs(val - problemData.q[i]), problemData.r), 0), 1 / problemData.r);
                    break;
                case 'scaling':
                    const arr = Array.from({length: 5}, () => randInt(10, 90));
                    const target = arr[randInt(0, arr.length - 1)];
                    const mean = arr.reduce((a,b) => a+b, 0) / arr.length;
                    const variance = arr.reduce((a,b) => a + Math.pow(b - mean, 2), 0) / (arr.length - 1);
                    const std = Math.sqrt(variance);
                    const min = Math.min(...arr);
                    const max = Math.max(...arr);
                    problemData = {
                        arr, target, mean, std, min, max,
                        ansStandard: (target - mean) / std,
                        ansMinMax: (target - min) / (max - min)
                    };
                    break;
                case 'similarity':
                    const v1 = [randInt(0, 5), randInt(0, 5), randInt(0, 5), randInt(0, 5)];
                    const v2 = [randInt(0, 5), randInt(0, 5), randInt(0, 5), randInt(0, 5)];
                    const dot = v1.reduce((sum, a, i) => sum + a * v2[i], 0);
                    const mag1 = Math.sqrt(v1.reduce((sum, a) => sum + a * a, 0));
                    const mag2 = Math.sqrt(v2.reduce((sum, a) => sum + a * a, 0));
                    
                    const setA = new Set(Array.from({length: randInt(2, 4)}, () => randInt(1, 8)));
                    const setB = new Set(Array.from({length: randInt(2, 4)}, () => randInt(1, 8)));
                    const intersection = new Set([...setA].filter(x => setB.has(x)));
                    const union = new Set([...setA, ...setB]);

                    problemData = {
                        v1, v2,
                        ansCosine: mag1 === 0 || mag2 === 0 ? 0 : dot / (mag1 * mag2),
                        setA: Array.from(setA),
                        setB: Array.from(setB),
                        ansJaccard: intersection.size / union.size
                    };
                    break;
                case 'trees':
                    const pYes = randInt(2, 10);
                    const pNo = randInt(2, 10);
                    const c1Yes = randInt(1, pYes);
                    const c1No = randInt(1, pNo);
                    const c2Yes = pYes - c1Yes;
                    const c2No = pNo - c1No;
                    
                    const totalP = pYes + pNo;
                    const giniParent = 1 - Math.pow(pYes/totalP, 2) - Math.pow(pNo/totalP, 2);
                    
                    const t1 = c1Yes + c1No;
                    const giniC1 = t1 === 0 ? 0 : 1 - Math.pow(c1Yes/t1, 2) - Math.pow(c1No/t1, 2);
                    
                    const t2 = c2Yes + c2No;
                    const giniC2 = t2 === 0 ? 0 : 1 - Math.pow(c2Yes/t2, 2) - Math.pow(c2No/t2, 2);
                    
                    const weightedGini = (t1/totalP) * giniC1 + (t2/totalP) * giniC2;
                    const infoGain = giniParent - weightedGini;

                    problemData = {
                        pYes, pNo, c1Yes, c1No, c2Yes, c2No,
                        ansGiniParent: giniParent,
                        ansWeightedGini: weightedGini,
                        ansInfoGain: infoGain
                    };
                    break;
                case 'performance':
                    const tp = randInt(20, 90);
                    const fp = randInt(5, 25);
                    const fn = randInt(5, 25);
                    const tn = randInt(30, 100);
                    const total = tp + fp + fn + tn;
                    
                    const accuracy = (tp + tn) / total;
                    const precision = (tp + fp) === 0 ? 0 : tp / (tp + fp);
                    const recall = (tp + fn) === 0 ? 0 : tp / (tp + fn);
                    const f1 = (precision + recall) === 0 ? 0 : (2 * precision * recall) / (precision + recall);

                    problemData = {
                        tp, fp, fn, tn,
                        ansAccuracy: accuracy,
                        ansPrecision: precision,
                        ansRecall: recall,
                        ansF1: f1
                    };
                    break;
                case 'bayes':
                    const yesCount = randInt(5, 15);
                    const noCount = randInt(5, 15);
                    const totalN = yesCount + noCount;
                    const featYes = randInt(1, yesCount - 1);
                    const featNo = randInt(1, noCount - 1);
                    const laplaceK = 1;
                    const laplaceV = 2; // binary feature classes

                    const priorYes = yesCount / totalN;
                    const condYes = (featYes + laplaceK) / (yesCount + laplaceK * laplaceV);
                    const posteriorUnnormalized = priorYes * condYes;

                    problemData = {
                        yesCount, noCount, featYes, featNo, totalN,
                        ansPrior: priorYes,
                        ansCond: condYes,
                        ansPosterior: posteriorUnnormalized
                    };
                    break;
                case 'stats':
                    const statsArr = Array.from({length: 6}, () => randInt(1, 50));
                    const meanVal = statsArr.reduce((a,b) => a+b, 0) / statsArr.length;
                    const varVal = statsArr.reduce((a,b) => a + Math.pow(b - meanVal, 2), 0) / (statsArr.length - 1);
                    problemData = {
                        statsArr,
                        ansMean: meanVal,
                        ansStd: Math.sqrt(varVal)
                    };
                    break;
            }
            renderModule();
        }

        // Render Sidebar Navigation
        function renderNav() {
            const nav = document.getElementById('moduleNav');
            nav.innerHTML = modules.map(m => `
                <button onclick="generateProblem('${m.id}')" class="w-full flex items-center space-x-3 px-3 py-3 rounded-2xl text-left transition ${currentModule === m.id ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400'}">
                    <i class="fa-solid ${m.icon} w-5 text-center"></i>
                    <div>
                        <div class="text-sm font-semibold">${m.name}</div>
                        <div class="text-xs opacity-75 truncate max-w-[180px]">${m.desc}</div>
                    </div>
                </button>
            `).join('');
        }

        // Render Active Module Content
        function renderModule() {
            renderNav();
            const container = document.getElementById('moduleContent');
            let contentHTML = '';

            switch(currentModule) {
                case 'distance':
                    contentHTML = `
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <span class="px-3 py-1 bg-blue-500/10 text-blue-600 dark:text-blue-400 text-xs font-semibold rounded-full">Module 1</span>
                                <h2 class="text-2xl font-bold mt-1">Distance & Norms</h2>
                                <p class="text-sm text-slate-500 dark:text-slate-400">Calculate Euclidean distance, Manhattan distance, and L<sub>r</sub> Minkowski norm.</p>
                            </div>
                            <button onclick="generateProblem('distance')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-xl text-sm font-medium transition flex items-center space-x-2">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>New Problem</span>
                            </button>
                        </div>

                        <!-- Data Table -->
                        <div class="mb-6 overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-200 dark:border-slate-800 text-xs uppercase tracking-wider text-slate-400">
                                        <th class="py-3 px-4">Vector / Parameter</th>
                                        <th class="py-3 px-4">Dimension 1 (x₁)</th>
                                        <th class="py-3 px-4">Dimension 2 (x₂)</th>
                                        <th class="py-3 px-4">Dimension 3 (x₃)</th>
                                        <th class="py-3 px-4">Norm Parameter (r)</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 dark:divide-slate-800 text-sm font-mono">
                                    <tr>
                                        <td class="py-3 px-4 font-sans font-semibold text-blue-600 dark:text-blue-400">Vector p</td>
                                        <td class="py-3 px-4">${problemData.p[0]}</td>
                                        <td class="py-3 px-4">${problemData.p[1]}</td>
                                        <td class="py-3 px-4">${problemData.p[2]}</td>
                                        <td class="py-3 px-4 text-slate-400">-</td>
                                    </tr>
                                    <tr>
                                        <td class="py-3 px-4 font-sans font-semibold text-indigo-600 dark:text-indigo-400">Vector q</td>
                                        <td class="py-3 px-4">${problemData.q[0]}</td>
                                        <td class="py-3 px-4">${problemData.q[1]}</td>
                                        <td class="py-3 px-4">${problemData.q[2]}</td>
                                        <td class="py-3 px-4 text-slate-400">-</td>
                                    </tr>
                                    <tr class="bg-slate-50/50 dark:bg-slate-800/30">
                                        <td class="py-3 px-4 font-sans font-semibold text-slate-500">Minkowski Order (r)</td>
                                        <td colspan="3" class="py-3 px-4 text-slate-400">-</td>
                                        <td class="py-3 px-4 font-bold text-amber-500">${problemData.r}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Formulas Hint -->
                        <div class="mb-6 p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800 space-y-2">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Formulas</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                                <div><strong>Euclidean:</strong> <span class="katex-formula">d(p,q) = √Σ(pᵢ - qᵢ)²</span></div>
                                <div><strong>Manhattan:</strong> <span class="katex-formula">d(p,q) = Σ|pᵢ - qᵢ|</span></div>
                                <div><strong>Minkowski:</strong> <span class="katex-formula">Lᵣ(p,q) = (Σ|pᵢ - qᵢ|ʳ)^(1/r)</span></div>
                            </div>
                        </div>

                        <!-- Input fields -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Euclidean Distance</label>
                                <input type="number" step="any" id="ans1" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter value...">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Manhattan Distance</label>
                                <input type="number" step="any" id="ans2" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter value...">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">L<sub>${problemData.r}</sub> Norm Distance</label>
                                <input type="number" step="any" id="ans3" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter value...">
                            </div>
                        </div>

                        <div class="flex items-center space-x-4">
                            <button onclick="checkDistance()" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold shadow-lg shadow-blue-500/30 transition">Check Answer</button>
                            <button onclick="showSolutionDistance()" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-xl text-sm font-semibold transition">Show Solution</button>
                        </div>
                        <div id="feedback" class="mt-4"></div>
                    `;
                    break;
                case 'scaling':
                    contentHTML = `
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <span class="px-3 py-1 bg-blue-500/10 text-blue-600 dark:text-blue-400 text-xs font-semibold rounded-full">Module 2</span>
                                <h2 class="text-2xl font-bold mt-1">Scaling & Normalization</h2>
                                <p class="text-sm text-slate-500 dark:text-slate-400">Compute Z-score standard scaling and Min-Max normalization for target value.</p>
                            </div>
                            <button onclick="generateProblem('scaling')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-xl text-sm font-medium transition flex items-center space-x-2">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>New Problem</span>
                            </button>
                        </div>

                        <!-- Data Table -->
                        <div class="mb-6 overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-200 dark:border-slate-800 text-xs uppercase tracking-wider text-slate-400">
                                        <th class="py-3 px-4">Dataset Elements</th>
                                        <th class="py-3 px-4">Target Value (x)</th>
                                        <th class="py-3 px-4">Sample Mean (μ)</th>
                                        <th class="py-3 px-4">Sample Std Dev (σ)</th>
                                        <th class="py-3 px-4">Min / Max</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 dark:divide-slate-800 text-sm font-mono">
                                    <tr>
                                        <td class="py-3 px-4 font-sans font-semibold text-blue-600 dark:text-blue-400">[${problemData.arr.join(', ')}]</td>
                                        <td class="py-3 px-4 font-bold text-emerald-500">${problemData.target}</td>
                                        <td class="py-3 px-4">${problemData.mean.toFixed(2)}</td>
                                        <td class="py-3 px-4">${problemData.std.toFixed(2)}</td>
                                        <td class="py-3 px-4">${problemData.min} / ${problemData.max}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="mb-6 p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800 space-y-2">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Formulas</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                <div><strong>StandardScaler:</strong> <span class="katex-formula">z = (x - μ) / σ</span></div>
                                <div><strong>MinMaxScaler:</strong> <span class="katex-formula">x_norm = (x - x_min) / (x_max - x_min)</span></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Standard Scaled Value (z)</label>
                                <input type="number" step="any" id="ans1" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter value...">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Min-Max Scaled Value [0, 1]</label>
                                <input type="number" step="any" id="ans2" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter value...">
                            </div>
                        </div>

                        <div class="flex items-center space-x-4">
                            <button onclick="checkScaling()" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold shadow-lg shadow-blue-500/30 transition">Check Answer</button>
                            <button onclick="showSolutionScaling()" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-xl text-sm font-semibold transition">Show Solution</button>
                        </div>
                        <div id="feedback" class="mt-4"></div>
                    `;
                    break;
                case 'similarity':
                    contentHTML = `
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <span class="px-3 py-1 bg-blue-500/10 text-blue-600 dark:text-blue-400 text-xs font-semibold rounded-full">Module 3</span>
                                <h2 class="text-2xl font-bold mt-1">Similarity & Metrics</h2>
                                <p class="text-sm text-slate-500 dark:text-slate-400">Calculate Cosine Similarity between vectors and Jaccard Coefficient between sets.</p>
                            </div>
                            <button onclick="generateProblem('similarity')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-xl text-sm font-medium transition flex items-center space-x-2">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>New Problem</span>
                            </button>
                        </div>

                        <!-- Data Table -->
                        <div class="mb-6 overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-200 dark:border-slate-800 text-xs uppercase tracking-wider text-slate-400">
                                        <th class="py-3 px-4">Metric / Object</th>
                                        <th class="py-3 px-4">Values / Elements</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 dark:divide-slate-800 text-sm font-mono">
                                    <tr>
                                        <td class="py-3 px-4 font-sans font-semibold text-blue-600">Vector v₁</td>
                                        <td class="py-3 px-4">[${problemData.v1.join(', ')}]</td>
                                    </tr>
